<!doctype html>
<html>
  <head>
    <title>ClearPath recording studio</title>
    <style>
      body {
        font: 20px system-ui;
        background: #102e25;
        color: white;
        padding: 60px;
      }
      button,
      a {
        font: inherit;
        padding: 20px;
        margin: 10px;
        color: #102e25;
        background: #c7e6b6;
        border: 0;
        border-radius: 10px;
      }
      p {
        max-width: 700px;
      }
    </style>
  </head>
  <body>
    <h1>ClearPath recording studio</h1>
    <p>
      Record the ClearPath app browser tab with the cursor visible. Audio is
      disabled. The recording remains local and is downloaded when stopped.
    </p>
    <button id="start">Start tab recording</button
    ><button id="stop" disabled>Stop and save recording</button>
    <p id="status">Ready</p>
    <div id="result"></div>
    <script>
      let recorder,
        stream,
        chunks = [];
      start.onclick = async () => {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: {
              displaySurface: "browser",
              frameRate: 30,
              cursor: "always",
            },
            audio: false,
            selfBrowserSurface: "exclude",
            surfaceSwitching: "exclude",
          });
          recorder = new MediaRecorder(stream, {
            mimeType: "video/webm;codecs=vp9",
            videoBitsPerSecond: 5000000,
          });
          recorder.ondataavailable = (e) => {
            if (e.data.size) chunks.push(e.data);
          };
          recorder.onstop = () => {
            let a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob(chunks, { type: "video/webm" }),
            );
            a.download = "clearpath-live-recording.webm";
            a.textContent = "Download recorded video";
            result.append(a);
            document.getElementById("status").textContent =
              "Recording saved in memory. Download it now.";
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start(1000);
          window.recordingStarted = Date.now();
          document.getElementById("status").textContent = "Recording live";
          start.disabled = true;
          document.getElementById("stop").disabled = false;
        } catch (e) {
          document.getElementById("status").textContent = e.message;
        }
      };
      document.getElementById("stop").onclick = () => {
        recorder.stop();
        document.getElementById("stop").disabled = true;
      };
    </script>
  </body>
</html>
